[package]
name = "dm-desktop"
description = "Tauri desktop shell: window, tray and the bridge from the UI to the background service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "dm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Packaged-app smoke tests only (B0.5): writes the window/service handshake to $DOWNOVA_SMOKE_FILE.
smoke = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
dm-domain.workspace = true
dm-platform = { path = "../../../crates/platform" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-single-instance = "2.5.4"
tokio = { version = "1.54.0", features = ["sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
