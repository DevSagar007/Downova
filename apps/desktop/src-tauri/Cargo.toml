[package]
name = "dm-desktop"
description = "Tauri desktop shell: window, tray and the bridge from the UI to the background service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "dm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# ADV09 (ADR 0030): a test binary whose compiled updater config may use a loopback HTTP endpoint
# and a disposable key. Never enabled for normal packages (scripts/package.mjs refuses it).
update-fixture = []
# Packaged-app smoke tests only (B0.5): writes the window/service handshake to $DOWNOVA_SMOKE_FILE.
smoke = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
dm-domain.workspace = true
dm-platform = { path = "../../../crates/platform" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tokio = { version = "1.54.0", features = ["sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
# ADV09: the updater verifier test runs the real plugin on Tauri's mock runtime.
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
