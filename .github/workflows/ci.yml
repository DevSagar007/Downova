name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Platform support is claimed only for runners listed here and passing (REL-02).
        os: [windows-latest, macos-latest, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Linux system dependencies (Tauri v2 prerequisites + aria2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev aria2

      - name: macOS aria2
        if: runner.os == 'macOS'
        run: brew install aria2

      - name: Windows aria2 (pinned, SHA-256 checked)
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/fetch-aria2.mjs

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (strict — unavailable checks fail the job)
        run: pnpm verify:strict

      # B0.6: real Chrome (preinstalled on the runner images), isolated temporary profile,
      # reversible per-user registration; see docs/reports/b0.6-browser-handoff.md.
      - name: Real-browser hand-off (Chrome → native host → service)
        if: runner.os != 'Linux' || matrix.os == 'ubuntu-24.04'
        timeout-minutes: 15
        run: node scripts/e2e/chrome-handoff.mjs

      - name: Upload browser hand-off results
        if: always() && (runner.os != 'Linux' || matrix.os == 'ubuntu-24.04')
        uses: actions/upload-artifact@v4
        with:
          name: browser-handoff-${{ matrix.os }}-${{ github.sha }}
          path: smoke-results/e2e-*/
          if-no-files-found: warn
          retention-days: 14
