[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/backend-api",
    "crates/service",
    "crates/backend-aria2",
    "crates/platform",
    "crates/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
# Project license is an open decision (see docs/decisions/0001-project-foundation.md).

[workspace.dependencies]
dm-domain = { path = "crates/domain" }
dm-backend-api = { path = "crates/backend-api" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tauri-build = { version = "2.7.3", features = [] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Byte offsets must never silently wrap; use checked arithmetic.
arithmetic_side_effects = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
