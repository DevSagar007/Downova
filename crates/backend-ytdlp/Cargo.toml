[package]
name = "dm-backend-ytdlp"
description = "Explicit yt-dlp media sidecar behind dm-backend-api; isolated single-item output and service-owned finalization."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dm-domain.workspace = true
dm-backend-api.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
tokio = { version = "1.54.0", features = ["process", "time", "sync", "rt", "macros", "io-util"] }

[dev-dependencies]
dm-test-fixtures = { path = "../test-fixtures" }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["full"] }

[lints]
workspace = true
