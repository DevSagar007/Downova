[package]
name = "dm-platform"
description = "OS adapters: per-user data paths, endpoint discovery and secure local IPC (named pipe / Unix socket) shared by the service and its clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dm-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
getrandom = "0.4.3"
interprocess = { version = "2.4.6", features = ["tokio"] }
tokio = { version = "1.54.0", features = ["io-util", "time", "rt", "macros", "fs", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["full"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"
