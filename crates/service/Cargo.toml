[package]
name = "dm-service"
description = "Background download coordinator: job lifecycle, queues, policy, backend control and the single SQLite writer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "dm-service"
path = "src/main.rs"

[dependencies]
dm-domain.workspace = true
dm-backend-api.workspace = true
dm-backend-aria2 = { path = "../backend-aria2" }
dm-backend-http = { path = "../backend-http" }
dm-platform = { path = "../platform" }
dm-storage = { path = "../storage" }
serde.workspace = true
serde_json.workspace = true
getrandom = "0.4.3"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.1"
unicode-segmentation = "1.13.3"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }

[dev-dependencies]
dm-test-fixtures = { path = "../test-fixtures" }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["full", "test-util"] }

[lints]
workspace = true
