[package]
name = "dm-backend-http"
description = "Rust HTTP/HTTPS backend prototype implementing dm-backend-api (ADR 0004): Tokio, reqwest and rustls with the platform verifier, manual redirects, identity encoding, backend-owned partial files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dm-domain.workspace = true
dm-backend-api.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# reqwest 0.13: `rustls-no-provider` keeps aws-lc-rs out of the build; the backend supplies its own
# rustls ClientConfig (ring provider + platform verifier) through `tls_backend_preconfigured`.
# No `gzip`/`brotli`/`deflate`/`zstd` features: responses are never decompressed.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
tokio = { version = "1.54.0", features = ["fs", "io-util", "net", "rt", "sync", "time", "macros"] }
# F05 (ADR 0035): anonymous FTP, passive data only, no TLS features (FTPS is a later step).
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio"] }

[dev-dependencies]
dm-test-fixtures = { path = "../test-fixtures" }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["full", "test-util"] }

[lints]
workspace = true
