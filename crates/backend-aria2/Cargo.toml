[package]
name = "dm-backend-aria2"
description = "aria2 sidecar adapter implementing dm-backend-api: process launch, loopback JSON-RPC with a random secret, attempt-to-GID mapping, capability report."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dm-domain.workspace = true
dm-backend-api.workspace = true
serde_json.workspace = true
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio = { version = "1.54.0", features = ["process", "time", "sync", "net", "rt", "macros", "io-util"] }

[dev-dependencies]
dm-test-fixtures = { path = "../test-fixtures" }
flate2 = "1.1.10"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["full"] }

[lints]
workspace = true
