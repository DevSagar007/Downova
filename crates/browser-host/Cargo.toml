[package]
name = "dm-browser-host"
description = "Chrome-family native-messaging host: validates the caller, frames and the NativeHostRequest contract, and forwards explicit public-GET hand-offs to the per-user service over IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "dm-browser-host"
path = "src/main.rs"

[dependencies]
dm-domain.workspace = true
dm-platform = { path = "../platform" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.0", features = ["rt", "time", "macros"] }

[dev-dependencies]
dm-test-fixtures = { path = "../test-fixtures" }
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["full"] }

[lints]
workspace = true
